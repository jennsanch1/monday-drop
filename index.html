const esc = str => String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
const parseMd = str => esc(str)

const getWeekNum  = () => { const n=new Date(); return Math.ceil(((n-new Date(n.getFullYear(),0,1))/86400000+1)/7); };

function parseReport(text) {
  const s=[]; let title='',lines=[];
  for (const line of text.split('\n')) {
    if (line.startsWith('## ')) { if(title) s.push({title:title.replace(/^##\s*/,''),body:lines.join('\n').trim()}); title=line; lines=[]; }
    else lines.push(line);
  }
  if (title) s.push({title:title.replace(/^##\s*/,''),body:lines.join('\n').trim()});
  return s.length ? s : [{title:"THIS WEEK'S INTELLIGENCE",body:text}];
}

function parseClientBlocksFromBody(body) {
  const blocks=[]; let cur=null;
  for (const line of body.split('\n')) {
    if (line.match(/^\*\*.+\*\*/)) { if(cur) blocks.push(cur); cur={name:line.replace(/\*\*/g,'').trim(),lines:[]}; }
    else if (cur&&line.trim()) cur.lines.push(line);
  }
  if (cur) blocks.push(cur);
  return blocks;
}

// ─── PERPLEXITY ───────────────────────────────────────────────────────────────
async function callPerplexity() {
  const clientList = state.clients.map(c=>`${c.name} (${c.industry})`).join(', ');
  const res = await fetch('https://api.perplexity.ai/chat/completions', {
    method:'POST',
    headers:{'Authorization':`Bearer ${state.perplexityKey}`,'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'sonar',
      messages:[{role:'user',content:`You are a research agent for a creative design studio. Find the most important news from the past 7 days for these clients and for the design industry.

Clients: ${clientList}

Find:
1. 1-2 key news items per client (product launches, funding, leadership changes, strategic moves)
2. 3 notable design or tech trend stories this week worth a creative studio knowing

Return ONLY valid JSON, no other text:
{"clientNews":[{"company":"name","headline":"...","source":"outlet","daysAgo":N,"brief":"1 sentence"}],"designSignals":[{"headline":"...","source":"outlet","daysAgo":N,"brief":"1 sentence"}]}`}],
      search_recency_filter:'week',
    }),
  });
  if (!res.ok) throw new Error(`Perplexity error: ${res.status} ${res.statusText}`);
  const data = await res.json();
  const txt = data.choices?.[0]?.message?.content || '{}';
  try {
    const m = txt.match(/\{[\s\S]*\}/);
    return m ? JSON.parse(m[0]) : {clientNews:[],designSignals:[]};
  } catch(e) { return {clientNews:[],designSignals:[]}; }
}

function formatPerplexityContext(signals) {
  if (!signals) return '';
  let out = 'LIVE RESEARCH DATA from Perplexity (past 7 days) — use as primary factual foundation:\n\n';
  if (signals.clientNews?.length) {
    out += 'CLIENT NEWS:\n';
    signals.clientNews.forEach(n=>{out+=`• ${n.company}: ${n.headline} (${n.source}, ${n.daysAgo===0?'today':n.daysAgo===1?'yesterday':n.daysAgo+' days ago'}) — ${n.brief}\n`;});
  }
  if (signals.designSignals?.length) {
    out += '\nDESIGN & INDUSTRY SIGNALS:\n';
    signals.designSignals.forEach(n=>{out+=`• ${n.headline} (${n.source}, ${n.daysAgo===0?'today':n.daysAgo===1?'yesterday':n.daysAgo+' days ago'}) — ${n.brief}\n`;});
  }
  return out;
}

      msg += `📡 *CLIENT WATCH*\n`;

        const name=b.name.split('(')[0].trim();
        const news=(b.lines.find(l=>l.match(/^News:/i))||'').replace(/^News:\s*/i,'').replace(/\*\*/g,'').trim();

      });

      msg+=`↗️ *THE MOVE THIS WEEK*\n`;
      const c=s.body.replace(/\*\*/g,'*').trim();
      msg+=`>${c.length>300?c.slice(0,300)+'…':c}\n\n`;
    } else if (s.title==='STUDIO TOOL ALERT') {
      msg+=`⚡ *STUDIO TOOL ALERT*\n`;
      const c=s.body.replace(/\*\*/g,'*').trim();
      msg+=`${c.length>220?c.slice(0,220)+'…':c}\n\n`;
    }
  }
  if (state.siteUrl) msg+=`\n<${state.siteUrl}|View Full Report>`;
  return msg.trimEnd();
}

function renderSlackMsgPreview(msg) {
  let inMove = false;
  return msg.split('\n').map(line=>{
    if (line.includes('THE MOVE THIS WEEK')) inMove = true;
    else if (line.match(/^[📡⚡🏢👁🔍]/)) inMove = false;
    if (line.startsWith('━')) return `<div style="border-top:1px solid rgba(255,255,255,0.08);margin:6px 0;"></div>`;
    if (line.startsWith('>')) {
      const formatted = esc(line.slice(1)).replace(/\*(.+?)\*/g,'<strong style="color:#fff;">$1</strong>');
      if (inMove) return `<div style="border-left:3px solid ${C.lime};padding:8px 12px;background:rgba(215,230,65,0.05);border-radius:0 4px 4px 0;color:rgba(255,255,255,0.7);font-size:12.5px;line-height:1.6;margin:4px 0;">${formatted}</div>`;
      return `<div style="border-left:2px solid rgba(255,255,255,0.2);padding-left:10px;color:rgba(255,255,255,0.5);font-style:italic;margin:2px 0;font-size:12.5px;">${formatted}</div>`;
    }
    const formatted=esc(line).replace(/&lt;https?:\/\/[^|]+\|([^>]+)&gt;/g,'<span style="color:rgba(255,255,255,0.6);">$1</span>').replace(/\*(.+?)\*/g,'<strong style="color:#fff;">$1</strong>').replace(/_(.*?)_/g,'<em>$1</em>');
    const isHeader=line.match(/^[📡👁🏢↗️⚡🔍]/);
    return `<div style="font-size:${isHeader?'13px':'12.5px'};font-weight:${isHeader?600:400};color:${isHeader?'#fff':'rgba(255,255,255,0.55)'};line-height:1.6;margin-bottom:${isHeader?'3px':'1px'};">${formatted||'&nbsp;'}</div>`;
  }).join('');
}

async function sendToSlack() {
  if (!state.slackWebhook || state.slackSending) return;
  state.slackSending=true; state.slackSent=false; state.slackError=''; render();
  try {
    await fetch(state.slackWebhook, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        username:'Labi', icon_emoji:':mag:',
        text: generateSlackMessage(),
      }),
    });
    state.slackSent=true; state.slackSending=false; render();
    setTimeout(()=>{state.slackSent=false;render();},4000);
  } catch(e) {
    state.slackError='Failed to send. Check your webhook URL.';
    state.slackSending=false; render();
  }
}

// ─── SECTION RENDERERS ────────────────────────────────────────────────────────
function renderIndustrySection(body) {
  const blocks=[]; let cur=null;
  for(const line of body.split('\n')){
    if(line.match(/^\*\*.+\*\*/)){if(cur)blocks.push(cur);cur={name:line.replace(/\*\*/g,'').trim(),lines:[]};}
    else if(cur&&line.trim())cur.lines.push(line);
  }
  if(cur)blocks.push(cur);
  if(!blocks.length) return `<div style="padding:24px;font-family:${GF};font-size:14px;line-height:1.78;color:${C.muted};">${parseMd(body)}</div>`;

  const tabs = blocks.map((b,i)=>`
    <button class="client-tab" data-tab="${i}"
      style="padding:6px 14px;border-radius:100px;border:1px solid ${i===0?'rgba(215,230,65,0.3)':C.border};background:${i===0?'rgba(215,230,65,0.08)':'transparent'};color:${i===0?C.lime:C.dim};font-family:${GF};font-size:12px;font-weight:${i===0?600:400};">
      ${esc(b.name.split('(')[0].trim())}
    </button>`).join('');

  const panels = blocks.map((b,i)=>{
    const industry=b.name.match(/\(([^)]+)\)/)?.[1]||'';
    const rows=b.lines.map(line=>{
      const m=line.match(/^(News|Why it matters|Question to bring up):\s*(.*)/i);
      if(!m) return '';
      const labelColor={news:C.teal,'why it matters':C.blue,'question to bring up':C.muted}[m[1].toLowerCase()]||C.muted;
      return `<div style="padding:14px 0;border-bottom:1px solid ${C.border};">
        <div style="font-family:${GM};font-size:9px;font-weight:500;letter-spacing:0.14em;color:${labelColor};margin-bottom:7px;text-transform:uppercase;">${m[1]}</div>
        <div style="font-family:${GF};font-size:14px;color:${C.muted};line-height:1.7;">${parseMd(m[2])}</div>
      </div>`;
    }).join('');
    return `<div class="client-panel" data-panel="${i}" style="display:${i===0?'block':'none'};">
      <div style="display:flex;align-items:baseline;gap:10px;padding:18px 0 4px;">
        <div style="font-family:${GF};font-size:15px;font-weight:600;color:#fff;">${esc(b.name.split('(')[0].trim())}</div>
        ${industry?`<div style="font-family:${GM};font-size:10px;color:${C.dim};">${esc(industry)}</div>`:''}
      </div>
      ${rows}<div style="height:8px;"></div>
    </div>`;
  }).join('');

  return `<div>
    <div class="client-tabs-bar" style="display:flex;gap:6px;padding:14px 20px;border-bottom:1px solid ${C.border};overflow-x:auto;scrollbar-width:none;">${tabs}</div>
    <div style="padding:0 20px;">${panels}</div>
  </div>`;
}

function renderDesignSignals(body) {
  const items=[]; let cur=null;
  body.split('\n').forEach(line=>{
    const m=line.match(/^(\d+)\.\s+(.*)/);
    if(m){if(cur)items.push(cur);cur={num:m[1],text:m[2]};}
    else if(cur&&line.trim())cur.text+=' '+line.trim();
  });
  if(cur)items.push(cur);
  if(!items.length) return `<div style="padding:24px;font-family:${GF};font-size:14px;line-height:1.78;color:${C.muted};">${parseMd(body)}</div>`;
  return `<div style="padding:4px 20px 8px;">`+
    items.map((item,i)=>`
      <div style="display:flex;gap:20px;padding:18px 0;${i<items.length-1?`border-bottom:1px solid ${C.border}`:''}align-items:flex-start;">
        <div style="font-family:${GM};font-size:40px;font-weight:700;color:rgba(255,255,255,0.05);line-height:1;flex-shrink:0;min-width:40px;user-select:none;">${item.num}</div>
        <div style="font-family:${GF};font-size:14px;color:${C.muted};line-height:1.72;padding-top:7px;">${parseMd(item.text)}</div>
      </div>`).join('')+`</div>`;
}

function renderGenericBody(body) {
  return `<div style="padding:24px;font-family:${GF};font-size:14px;line-height:1.78;color:${C.muted};">`+
    body.split('\n').map(l=>`<div style="margin-bottom:4px;">${parseMd(l)||'&nbsp;'}</div>`).join('')+`</div>`;
}

function renderHistoryPanel() {
  const history = state.history;

  const shell = (backBtn, inner) => `

          ${backBtn?`<button id="history-back" style="background:none;border:none;color:${C.dim};cursor:pointer;font-family:${GM};font-size:9px;letter-spacing:0.1em;display:flex;align-items:center;gap:5px;padding:0;">← BACK</button><div style="width:1px;height:14px;background:${C.border};"></div>`:''}

      <div>
        <div style="font-size:32px;margin-bottom:12px;opacity:0.3;">🗂</div>
        <div style="font-family:${GF};font-size:13px;color:${C.dim};line-height:1.6;">No past drops yet.<br>Run your first drop to save it here.</div>
      </div>
    </div>`);

  // ── DETAIL VIEW ──────────────────────────────────────────────────────────────
  if (state.historyView === 'detail') {
    const item = history.find(h => h.id === state.historyDetailId) || history[0];
    const sections = parseReport(item.report);
    return shell(true, `
      <div style="flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;">
        <div style="animation:fadeInUp 0.2s ease forwards;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">

              <span style="font-family:${GM};font-size:22px;font-weight:800;color:#fff;letter-spacing:-0.02em;">WK ${item.weekNum}</span>
              <span style="font-family:${GM};font-size:9px;color:${C.dim};background:${C.surface};padding:3px 10px;border-radius:100px;border:1px solid ${C.border};">${esc(item.date)}</span>
            </div>
            <button class="delete-history-selected" data-id="${item.id}" style="background:none;border:none;color:${C.dim};cursor:pointer;font-family:${GM};font-size:9px;opacity:0.4;text-decoration:underline;transition:opacity 0.15s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.4">delete</button>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px;">
            ${item.clients.map(c=>`<span style="font-family:${GF};font-size:10px;color:${C.dim};background:${C.surface};padding:2px 8px;border-radius:100px;border:1px solid ${C.border};">${esc(c)}</span>`).join('')}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${sections.map((s,i)=>{
            const meta = SECTION_META[s.title] || {icon:'•', label:s.title};
            const col = WEEK_COLORS[i % WEEK_COLORS.length];
            const bodyHtml = esc(s.body.trim())
              .replace(/\*\*(.+?)\*\*/g,'<strong style="color:#fff;font-weight:600;">$1</strong>')
              .replace(/\*(.+?)\*/g,'<em style="color:rgba(255,255,255,0.7);">$1</em>');
            return `
            <div style="background:${col.bg};border:1px solid ${col.border};border-radius:10px;padding:16px;animation:fadeInUp 0.25s ease ${i*50}ms forwards;opacity:0;">
              <div style="display:flex;align-items:center;gap:7px;margin-bottom:10px;">
                <span style="font-size:14px;">${meta.icon}</span>
                <span style="font-family:${GM};font-size:9px;letter-spacing:0.12em;color:${col.accent};font-weight:600;">${meta.label}</span>
              </div>

            </div>`;

        </div>
      </div>`);
  }

  // ── BOARD VIEW (sticky notes) ─────────────────────────────────────────────
  return shell(false, `
    <div style="flex:1;overflow-y:auto;padding:20px;">
      <div style="font-family:${GM};font-size:9px;color:${C.dim};letter-spacing:0.12em;margin-bottom:14px;">TAP A WEEK TO EXPLORE</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        ${history.map((item, i) => {
          const col = WEEK_COLORS[i % WEEK_COLORS.length];
          const clientPreview = item.clients.slice(0,3).join(' · ') + (item.clients.length > 3 ? ` +${item.clients.length-3}` : '');
          return `
          <button class="history-board-note" data-id="${item.id}" style="
            background:${col.bg};border:1px solid ${col.border};border-radius:12px;
            padding:18px 16px;cursor:pointer;text-align:left;
            transition:transform 0.15s,border-color 0.15s,box-shadow 0.15s;
            animation:fadeInUp 0.3s ease ${i*60}ms forwards;opacity:0;
          " onmouseover="this.style.transform='translateY(-3px)';this.style.boxShadow='0 8px 24px rgba(0,0,0,0.4)';this.style.borderColor='${col.accent}';"
            onmouseout="this.style.transform='';this.style.boxShadow='';this.style.borderColor='${col.border}';">
            <div style="font-family:${GM};font-size:28px;font-weight:800;color:${col.accent};letter-spacing:-0.02em;line-height:1;margin-bottom:8px;">WK ${item.weekNum}</div>

            <div style="font-family:${GF};font-size:11px;color:rgba(255,255,255,0.4);line-height:1.5;">${esc(clientPreview)}</div>
          </button>`;
        }).join('')}
      </div>
    </div>`);
}

        ${state.phase==='running'?`<div style="display:flex;align-items:center;gap:6px;"><div class="pulse-dot" style="width:6px;height:6px;border-radius:50%;background:${C.blue};"></div><span style="font-family:${GM};font-size:9px;letter-spacing:0.12em;color:${C.dim};">SCANNING</span></div>`:''}
        ${state.phase==='done'?`<div style="display:flex;align-items:center;gap:6px;"><div style="width:6px;height:6px;border-radius:50%;background:${C.teal};"></div><span style="font-family:${GM};font-size:9px;letter-spacing:0.12em;color:${C.dim};">READY</span></div>`:''}
        ${state.demoMode?`<span style="font-family:${GM};font-size:9px;color:${C.purple};background:rgba(216,92,224,0.1);padding:3px 10px;border-radius:100px;">DEMO</span>`:''}
        ${state.perplexityKey&&!state.demoMode?`<div style="display:flex;align-items:center;gap:5px;background:rgba(0,153,255,0.08);border:1px solid rgba(0,153,255,0.2);border-radius:100px;padding:3px 10px;"><div class="pulse-dot" style="width:4px;height:4px;border-radius:50%;background:${C.blue};"></div><span style="font-family:${GM};font-size:8px;letter-spacing:0.1em;color:${C.blue};">PERPLEXITY</span></div>`:''}
        ${state.history.length>0?`
        <button id="history-btn" style="background:none;border:1px solid ${C.border};border-radius:100px;padding:4px 10px;color:${C.dim};cursor:pointer;font-family:${GM};font-size:9px;letter-spacing:0.1em;display:flex;align-items:center;gap:5px;transition:all 0.15s ease;" onmouseover="this.style.color='#fff';this.style.borderColor='rgba(255,255,255,0.2)'" onmouseout="this.style.color='${C.dim}';this.style.borderColor='${C.border}'">
          <span style="display:flex;">${ICON_HISTORY}</span> ${state.history.length}
        </button>`:''}
        <button id="reset-key-btn" style="background:none;border:none;color:${C.dim};cursor:pointer;font-family:${GM};font-size:9px;letter-spacing:0.1em;transition:color 0.15s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='${C.dim}'">
          ${state.demoMode?'EXIT DEMO':'RESET KEY'}
        </button>
      </div>
    </div>


    <div style="max-width:800px;margin:0 auto;padding:60px 40px 100px;">

      <div class="fu1" style="margin-bottom:56px;">
        <div style="margin-bottom:20px;"><span style="font-family:${GM};font-size:9px;letter-spacing:0.16em;color:${C.dim};background:${C.surface};border:1px solid ${C.border};padding:4px 12px;border-radius:100px;">WEEKLY BRIEFING</span></div>
        <div style="font-family:'Geist',sans-serif;font-weight:700;font-size:clamp(48px,8vw,80px);line-height:0.95;letter-spacing:-0.04em;color:#fff;margin-bottom:20px;">Monday<br><span style="color:${C.muted};">Intelligence</span><br>Drop</div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="font-family:${GM};font-size:10px;font-weight:500;letter-spacing:0.06em;color:${C.lime};background:rgba(215,230,65,0.1);border:1px solid rgba(215,230,65,0.25);padding:5px 14px;border-radius:100px;">${today}</span>
          <span style="font-family:${GM};font-size:10px;color:${C.dim};">WK ${weekNum}</span>
        </div>
      </div>

      ${state.phase!=='running'?`
      <div class="fu2" style="margin-bottom:28px;">
        <div style="font-family:${GM};font-size:9px;letter-spacing:0.14em;color:${C.dim};margin-bottom:12px;">ACTIVE CLIENTS — ${state.clients.length}</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
          ${state.clients.map(c=>`
            <div class="chip" style="display:inline-flex;flex-direction:column;padding:8px 14px;background:${C.surface};border:1px solid ${C.border};border-radius:6px;cursor:default;">
              <div style="display:flex;align-items:center;gap:8px;">
                <span style="font-family:${GF};font-size:13px;font-weight:500;color:#fff;">${esc(c.name)}</span>
                <button class="remove-client" data-id="${c.id}" style="background:none;border:none;color:${C.dim};cursor:pointer;font-size:14px;line-height:1;padding:0;transition:color 0.1s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='${C.dim}'">×</button>
              </div>
              <span style="font-family:${GM};font-size:10px;color:${C.dim};margin-top:2px;">${esc(c.industry)}</span>
            </div>`).join('')}
          ${!state.addingClient?`<button id="add-client-btn" class="ghost-btn" style="padding:8px 16px;background:transparent;border:1px dashed ${C.border};border-radius:6px;font-family:${GF};font-size:12px;color:${C.dim};cursor:pointer;letter-spacing:0.04em;align-self:stretch;">+ Add Client</button>`:''}
        </div>
        ${state.addingClient?`
        <div class="fu" style="background:${C.card};border:1px solid ${C.border};border-radius:8px;padding:16px;display:grid;grid-template-columns:1fr 1fr auto auto;gap:10px;align-items:center;margin-bottom:8px;">
          <input id="new-client-name" autofocus placeholder="Client name" value="${esc(state.newClient.name)}" style="padding:9px 12px;border:1px solid ${C.border};border-radius:6px;font-family:${GF};font-size:13px;background:${C.surface};color:#fff;" />
          <input id="new-client-industry" placeholder="Industry" value="${esc(state.newClient.industry)}" style="padding:9px 12px;border:1px solid ${C.border};border-radius:6px;font-family:${GF};font-size:13px;background:${C.surface};color:#fff;" />
          <button id="confirm-add-btn" style="padding:9px 16px;background:${C.blue};border:none;border-radius:6px;font-family:${GF};font-size:12px;font-weight:600;color:#fff;cursor:pointer;white-space:nowrap;">Add</button>
          <button id="cancel-add-btn" class="ghost-btn" style="padding:9px 12px;background:transparent;border:1px solid ${C.border};border-radius:6px;font-family:${GF};font-size:12px;color:${C.dim};cursor:pointer;">✕</button>
        </div>`:''}
      </div>`:''}

      ${state.phase==='idle'?`
      <div class="fu3" style="margin-bottom:24px;">
        <div style="font-family:${GM};font-size:9px;letter-spacing:0.14em;color:${C.dim};margin-bottom:8px;">STUDIO FOCUS THIS WEEK <span style="color:rgba(255,255,255,0.15);">— OPTIONAL</span></div>
        <input id="focus-input" value="${esc(state.focus)}" placeholder="e.g. pitching two fintech clients, wrapping the DigitalOcean rebrand..."
          style="width:100%;padding:12px 16px;border:1px solid ${C.border};border-radius:6px;font-family:${GF};font-size:14px;background:${C.card};color:#fff;transition:all 0.15s;" />
      </div>
      <div class="fu4" style="height:1px;background:${C.border};margin-bottom:24px;"></div>
      <div class="fu5">
        <button id="run-btn" class="run-btn" ${!state.clients.length?'disabled':''}
          style="width:100%;padding:18px 28px;background:${state.clients.length?C.blue:C.surface};color:${state.clients.length?'#fff':C.dim};border:none;border-radius:8px;font-family:${GF};font-size:15px;font-weight:600;cursor:${state.clients.length?'pointer':'not-allowed'};display:flex;align-items:center;justify-content:space-between;">
          <span>▶  Run this week's drop</span>
          <div style="display:flex;align-items:center;gap:6px;">
            <span style="font-family:${GM};font-size:10px;font-weight:400;color:rgba(255,255,255,0.5);">${state.clients.length} clients</span>
            ${state.perplexityKey&&!state.demoMode?`<span style="font-family:${GM};font-size:9px;font-weight:500;color:rgba(255,255,255,0.8);background:rgba(255,255,255,0.1);padding:2px 8px;border-radius:100px;">⚡ Perplexity + Claude</span>`:`<span style="font-family:${GM};font-size:10px;font-weight:400;color:rgba(255,255,255,0.5);">· live web search</span>`}
          </div>
        </button>
        <div style="margin-top:8px;text-align:center;font-family:${GF};font-size:12px;color:${C.dim};">Typically takes 20–40 seconds</div>
      </div>`:''}

      ${state.error?`<div style="background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.2);border-radius:8px;padding:16px 20px;font-family:${GF};font-size:13.5px;color:#f87171;margin-top:16px;line-height:1.6;"><strong>Error:</strong> ${esc(state.error)}<br><span style="font-size:12px;color:${C.dim};">Check that your API key is valid and has the Web Search tool enabled.</span></div>`:''}

      ${state.phase==='running'?`
      <div class="fu">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">
          <div style="font-family:'Geist',sans-serif;font-size:22px;font-weight:700;letter-spacing:-0.03em;color:#fff;">Sweeping the web</div>
          <div style="display:flex;gap:3px;align-items:center;padding-top:2px;">
            ${[0,1,2].map(i=>`<div style="width:4px;height:${10+i*4}px;background:${C.blue};border-radius:2px;opacity:0.7;animation:glowPulse ${0.8+i*0.2}s ease ${i*0.15}s infinite;"></div>`).join('')}
          </div>
        </div>
        <div style="font-family:${GF};font-size:13px;color:${C.muted};margin-bottom:4px;">Researching ${state.clients.length} client${state.clients.length>1?'s':''} across ${industries} industr${industries===1?'y':'ies'}</div>
        ${renderScanLog()}
      </div>`:''}

      ${state.phase==='done'&&state.report?`
      <div class="fu">
        <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;">
          <div>
            <div style="font-family:'Geist',sans-serif;font-size:22px;font-weight:700;letter-spacing:-0.03em;color:#fff;">This week's drop</div>
            <div style="font-family:${GF};font-size:12px;color:${C.dim};margin-top:3px;">${sections.length} sections · ${state.liveSignals?`Perplexity + Claude · ${[...(state.liveSignals.clientNews||[]),...(state.liveSignals.designSignals||[])].length} live sources · `:'live research · '}${state.clients.length} clients</div>
          </div>
          <button id="reset-btn" class="ghost-btn" style="padding:8px 18px;background:transparent;border:1px solid ${C.border};border-radius:6px;font-family:${GF};font-size:12px;color:${C.dim};cursor:pointer;">↺ Run again</button>
        </div>
        ${renderSectionsWithBento(sections)}
        ${renderSlackPreview()}
        ${renderAutoPilot()}
        <div style="margin-top:32px;padding-top:20px;border-top:1px solid ${C.border};display:flex;justify-content:space-between;align-items:center;">
          <div style="font-family:${GM};font-size:10px;color:${C.dim};">Generated ${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
          <div style="font-family:${GM};font-size:9px;font-weight:500;letter-spacing:0.1em;color:${C.dim};background:${C.surface};border:1px solid ${C.border};padding:4px 12px;border-radius:100px;">THE LAB STUDIO</div>
        </div>
      </div>`:''}

    </div>
    ${state.showHistory?renderHistoryPanel():''}`;
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  const app=document.getElementById('app');
  if (!state.apiKey) { app.innerHTML=renderSetup(); bindSetup(); }
  else { app.innerHTML=renderMain(); bindMain(); }
}

// ─── BINDINGS ─────────────────────────────────────────────────────────────────
function bindSetup() {
  const input=document.getElementById('api-key-input');
  const errEl=document.getElementById('api-key-error');
  const save=()=>{
    const key=input.value.trim();
    if(!key.startsWith('sk-ant-')){errEl.textContent='Must start with sk-ant-';errEl.style.display='block';input.style.borderColor='rgba(248,113,113,0.5)';return;}
    localStorage.setItem('lab_mid_key',key);state.apiKey=key;
    const pplxInput=document.getElementById('pplx-key-input');
    if(pplxInput){const pk=pplxInput.value.trim();if(pk){localStorage.setItem('lab_pplx_key',pk);state.perplexityKey=pk;}}
    render();
  };
  input.addEventListener('keydown',e=>{if(e.key==='Enter')save();});
  input.addEventListener('input',()=>{errEl.style.display='none';input.style.borderColor=C.border;});
  document.getElementById('activate-btn').addEventListener('click',save);
  document.getElementById('demo-btn').addEventListener('click',()=>{state.demoMode=true;state.apiKey='demo';render();});
}

function bindMain() {
  document.getElementById('reset-key-btn')?.addEventListener('click',()=>{
    localStorage.removeItem('lab_mid_key');state.apiKey='';state.demoMode=false;
    state.phase='idle';state.report='';state.step=0;state.error='';render();
  });
  document.querySelectorAll('.remove-client').forEach(btn=>{
    btn.addEventListener('click',()=>{state.clients=state.clients.filter(c=>c.id!==parseInt(btn.dataset.id));render();});
  });
  document.getElementById('add-client-btn')?.addEventListener('click',()=>{state.addingClient=true;render();document.getElementById('new-client-name')?.focus();});
  document.getElementById('confirm-add-btn')?.addEventListener('click',doAddClient);
  document.getElementById('new-client-name')?.addEventListener('keydown',e=>{if(e.key==='Enter')doAddClient();});
  document.getElementById('new-client-industry')?.addEventListener('keydown',e=>{if(e.key==='Enter')doAddClient();});
  document.getElementById('cancel-add-btn')?.addEventListener('click',()=>{state.addingClient=false;state.newClient={name:'',industry:''};render();});
  document.getElementById('focus-input')?.addEventListener('input',e=>{state.focus=e.target.value;});
  document.getElementById('run-btn')?.addEventListener('click',runDrop);
  document.getElementById('reset-btn')?.addEventListener('click',()=>{state.phase='idle';state.report='';state.step=0;state.error='';render();});

  // Client tabs
  document.querySelectorAll('.client-tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const idx=parseInt(btn.dataset.tab);
      document.querySelectorAll('.client-tab').forEach((t,i)=>{
        const a=i===idx;
        t.style.background=a?'rgba(215,230,65,0.08)':'transparent';
        t.style.color=a?C.lime:C.dim;
        t.style.borderColor=a?'rgba(215,230,65,0.3)':C.border;
        t.style.fontWeight=a?'600':'400';
      });
      document.querySelectorAll('.client-panel').forEach((p,i)=>{p.style.display=i===idx?'block':'none';});
    });
  });

  // Slack
  document.getElementById('slack-toggle')?.addEventListener('click',()=>{state.slackOpen=!state.slackOpen;render();});
  document.getElementById('slack-show-more')?.addEventListener('click',()=>{state.slackOpen=true;render();});
  document.getElementById('slack-copy')?.addEventListener('click',()=>{
    navigator.clipboard.writeText(generateSlackMessage()).then(()=>{
      state.slackCopied=true;render();setTimeout(()=>{state.slackCopied=false;render();},2200);
    });
  });
  document.getElementById('slack-send')?.addEventListener('click',sendToSlack);
  document.getElementById('connect-slack-btn')?.addEventListener('click',()=>{state.showWebhookInput=!state.showWebhookInput;render();});
  document.getElementById('save-webhook-btn')?.addEventListener('click',()=>{
    const url=document.getElementById('webhook-input')?.value.trim()||'';
    if(!url.startsWith('https://hooks.slack.com/')){state.slackError='Must be a valid Slack webhook URL';render();return;}
    state.slackWebhook=url;state.showWebhookInput=false;state.slackError='';
    localStorage.setItem('lab_slack_webhook',url);render();
  });
  document.getElementById('disconnect-slack-btn')?.addEventListener('click',()=>{
    state.slackWebhook='';localStorage.removeItem('lab_slack_webhook');render();
  });
  document.getElementById('add-site-url-btn')?.addEventListener('click',()=>{state.showSiteUrlInput=!state.showSiteUrlInput;render();});
  document.getElementById('edit-site-url-btn')?.addEventListener('click',()=>{state.showSiteUrlInput=true;render();});
  document.getElementById('clear-site-url-btn')?.addEventListener('click',()=>{state.siteUrl='';localStorage.removeItem('lab_site_url');state.showSiteUrlInput=false;render();});
  document.getElementById('save-site-url-btn')?.addEventListener('click',()=>{
    const url=document.getElementById('site-url-input')?.value.trim()||'';
    if(!url.startsWith('http')){return;}
    state.siteUrl=url;state.showSiteUrlInput=false;localStorage.setItem('lab_site_url',url);render();
  });

  // History
  document.getElementById('history-btn')?.addEventListener('click',()=>{
    state.showHistory=true; state.historyView='board'; render();
  });
  document.getElementById('close-history')?.addEventListener('click',()=>{state.showHistory=false;render();});
  document.getElementById('history-back')?.addEventListener('click',()=>{state.historyView='board';render();});
  document.querySelectorAll('.history-board-note').forEach(btn=>{
    btn.addEventListener('click',()=>{
      state.historyDetailId=parseInt(btn.dataset.id);
      state.historyView='detail'; render();
    });
  });
  document.querySelectorAll('.delete-history-selected').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=parseInt(btn.dataset.id);
      state.history=state.history.filter(h=>h.id!==id);
      localStorage.setItem('lab_history',JSON.stringify(state.history));
      state.historyView='board'; render();
    });
  });

  // Auto-Pilot
  document.getElementById('autopilot-toggle')?.addEventListener('click',()=>{
    state.autoPilotEnabled=!state.autoPilotEnabled;
    localStorage.setItem('lab_autopilot', state.autoPilotEnabled);
    render();
  });
  document.getElementById('autopilot-simulate')?.addEventListener('click',()=>{
    if(state.autoPilotSimulating||state.autoPilotJustSent) return;
    state.autoPilotSimulating=true; render();
    setTimeout(()=>{
      const now=new Date();
      const entry={
        date:now.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),
        time:now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),
        status:'sent', clients:state.clients.length
      };
      state.autoPilotLog=[entry,...state.autoPilotLog].slice(0,5);
      localStorage.setItem('lab_autopilot_log',JSON.stringify(state.autoPilotLog));
      state.autoPilotSimulating=false; state.autoPilotJustSent=true; render();
      setTimeout(()=>{state.autoPilotJustSent=false;render();},3000);
    },2200);
  });
}

function doAddClient() {
  const name=(document.getElementById('new-client-name')?.value||'').trim();
  const industry=(document.getElementById('new-client-industry')?.value||'').trim();
  if(!name)return;
  state.clients.push({id:Date.now(),name,industry:industry||'Industry'});
  state.newClient={name:'',industry:''};state.addingClient=false;render();
}

// ─── RUN ──────────────────────────────────────────────────────────────────────
async function runDrop() {
  if(!state.clients.length)return;
  state.phase='running';state.report='';state.error='';state.step=0;state.liveSignals=null;state.perplexitySubLines=[];render();

  let elapsed=0;
  const timerInterval=setInterval(()=>{
    elapsed++;
    const el=document.getElementById('scan-elapsed');
    if(el)el.textContent=`${elapsed}s`;
  },1000);

  try {
    let pxContext='';

    // Phase 1: Perplexity research (real or demo simulation)
    if(state.perplexityKey||state.demoMode){
      state.step=1;updateScanLog();
      await new Promise(r=>setTimeout(r,600));
      state.step=2;updateScanLog();
      let signals;
      if(state.demoMode){
        await new Promise(r=>setTimeout(r,900)); // simulate search time
        signals=DEMO_SIGNALS;
      } else {
        signals=await callPerplexity();
        pxContext=formatPerplexityContext(signals);
      }
      state.liveSignals=signals;
      // Build sub-lines for scan log display
      const subLines=[];
      (signals.clientNews||[]).slice(0,3).forEach(n=>subLines.push(`${n.company}: ${n.headline.slice(0,60)}${n.headline.length>60?'…':''}`));
      (signals.designSignals||[]).slice(0,1).forEach(n=>subLines.push(`Design: ${n.headline.slice(0,55)}${n.headline.length>55?'…':''}`));
      state.perplexitySubLines=subLines;
      render(); // re-render to show sub-lines
      await new Promise(r=>setTimeout(r,500));
    }

    // Phase 2: remaining steps + Claude in parallel
    const steps=getScanSteps();
    const startStep=(state.perplexityKey||state.demoMode)?3:1;
    const stepThrough=async()=>{
      for(let i=startStep;i<=steps.length;i++){
        state.step=i;updateScanLog();
        await new Promise(r=>setTimeout(r,780));
      }
    };

    const [result]=await Promise.all([
      state.demoMode?Promise.resolve(DEMO_REPORT):callApi(state.apiKey,state.clients,state.focus,pxContext),
      stepThrough(),
    ]);

    clearInterval(timerInterval);
    state.report=result;state.phase='done';
    saveHistory(result);
  } catch(e) {
    clearInterval(timerInterval);
    state.error=e.message;state.phase='idle';
  }
  render();
}

function updateScanLog() {
  const stepEls=document.querySelectorAll('.scan-step');
  if(!stepEls.length)return;
  getScanSteps().forEach((_,i)=>{
    const el=stepEls[i];if(!el)return;
    const done=i<state.step-1,active=i===state.step-1;
    const icon=el.querySelector('.step-icon');
    if(icon){icon.textContent=done?'✓':active?'◎':'○';icon.style.color=done?C.teal:active?'#fff':C.dim;active?icon.classList.add('scan-blink'):icon.classList.remove('scan-blink');}
    const textSpan=el.querySelector('span:not(.step-icon)');
    if(textSpan){textSpan.style.color=(done||active)?'#fff':C.dim;textSpan.style.fontWeight=active?'500':'400';}
    const innerDiv=el.querySelector('div');
    if(innerDiv){
      let bar=innerDiv.querySelector('.prog-track');
      if(active&&!bar){const t=document.createElement('div');t.className='prog-track';t.style.cssText=`height:1px;background:${C.border};border-radius:1px;margin-top:8px;overflow:hidden;`;t.innerHTML=`<div style="height:100%;background:${C.blue};border-radius:1px;animation:progressBar 0.7s ease forwards;"></div>`;innerDiv.appendChild(t);}
      else if(!active&&bar)bar.remove();
    }
    let badge=el.querySelector('.done-badge');
    if(done&&!badge){const b=document.createElement('span');b.className='done-badge';b.style.cssText=`font-family:${GM};font-size:9px;letter-spacing:0.12em;color:${C.teal};background:rgba(0,230,197,0.08);padding:2px 8px;border-radius:100px;`;b.textContent='DONE';el.appendChild(b);}
    else if(!done&&badge)badge.remove();
  });
}

render();
</script>
