function parseReport(text) {
  const s=[]; let title='',lines=[];
  for (const line of text.split('\n')) {
    if (line.startsWith('## ')) { if(title) s.push({title:title.replace(/^##\s*/,''),body:lines.join('\n').trim()}); title=line; lines=[]; }
    else lines.push(line);
  }
  if (title) s.push({title:title.replace(/^##\s*/,''),body:lines.join('\n').trim()});
  return s.length ? s : [{title:"THIS WEEK'S INTELLIGENCE",body:text}];
}

function parseClientBlocksFromBody(body) {
  const blocks=[]; let cur=null;
  for (const line of body.split('\n')) {
    if (line.match(/^\*\*.+\*\*/)) { if(cur) blocks.push(cur); cur={name:line.replace(/\*\*/g,'').trim(),lines:[]}; }
    else if (cur&&line.trim()) cur.lines.push(line);
  }
  if (cur) blocks.push(cur);
  return blocks;
}

// ─── PERPLEXITY ───────────────────────────────────────────────────────────────
async function callPerplexity() {
  const clientList = state.clients.map(c=>`${c.name} (${c.industry})`).join(', ');
  const res = await fetch('https://api.perplexity.ai/chat/completions', {
    method:'POST',
    headers:{'Authorization':`Bearer ${state.perplexityKey}`,'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'sonar',
      messages:[{role:'user',content:`You are a research agent for a creative design studio. Find the most important news from the past 7 days for these clients and for the design industry.

Clients: ${clientList}

Find:
1. 1-2 key news items per client (product launches, funding, leadership changes, strategic moves)
2. 3 notable design or tech trend stories this week worth a creative studio knowing

Return ONLY valid JSON, no other text:
{"clientNews":[{"company":"name","headline":"...","source":"outlet","daysAgo":N,"brief":"1 sentence"}],"designSignals":[{"headline":"...","source":"outlet","daysAgo":N,"brief":"1 sentence"}]}`}],
      search_recency_filter:'week',
    }),
  });
  if (!res.ok) throw new Error(`Perplexity error: ${res.status} ${res.statusText}`);
  const data = await res.json();
  const txt = data.choices?.[0]?.message?.content || '{}';
  try {
    const m = txt.match(/\{[\s\S]*\}/);
    return m ? JSON.parse(m[0]) : {clientNews:[],designSignals:[]};
  } catch(e) { return {clientNews:[],designSignals:[]}; }
}

function formatPerplexityContext(signals) {
  if (!signals) return '';
  let out = 'LIVE RESEARCH DATA from Perplexity (past 7 days) — use as primary factual foundation:\n\n';
  if (signals.clientNews?.length) {
    out += 'CLIENT NEWS:\n';
    signals.clientNews.forEach(n=>{out+=`• ${n.company}: ${n.headline} (${n.source}, ${n.daysAgo===0?'today':n.daysAgo===1?'yesterday':n.daysAgo+' days ago'}) — ${n.brief}\n`;});
  }
  if (signals.designSignals?.length) {
    out += '\nDESIGN & INDUSTRY SIGNALS:\n';
    signals.designSignals.forEach(n=>{out+=`• ${n.headline} (${n.source}, ${n.daysAgo===0?'today':n.daysAgo===1?'yesterday':n.daysAgo+' days ago'}) — ${n.brief}\n`;});
  }
  return out;
}

// ─── SLACK MESSAGE ────────────────────────────────────────────────────────────
function generateSlackMessage() {
  const sections = parseReport(state.report);
  const today = getTodayShort();
  let msg = `🔍 *MONDAY INTELLIGENCE DROP* — ${today}\n━━━━━━━━━━━━━━━━━━━━━\n\n`;
  for (const s of sections) {
    if (s.title==='THIS WEEK IN CLIENT INDUSTRIES') {
      msg += `📡 *CLIENT WATCH*\n`;
      parseClientBlocksFromBody(s.body).forEach(b=>{
        const name=b.name.split('(')[0].trim();
        const news=(b.lines.find(l=>l.match(/^News:/i))||'').replace(/^News:\s*/i,'').replace(/\*\*/g,'').trim();
        if (news) msg+=`• *${name}* → ${news.length>120?news.slice(0,120)+'…':news}\n`;
      });
      msg+='\n\n';
    } else if (s.title==='ONE THING TO BRING UP WITH A CLIENT THIS WEEK') {
      msg+=`↗️ *THE MOVE THIS WEEK*\n`;
      const c=s.body.replace(/\*\*/g,'*').trim();
      msg+=`>${c.length>300?c.slice(0,300)+'…':c}\n\n`;
    } else if (s.title==='STUDIO TOOL ALERT') {
      msg+=`⚡ *STUDIO TOOL ALERT*\n`;
      const c=s.body.replace(/\*\*/g,'*').trim();
      msg+=`${c.length>220?c.slice(0,220)+'…':c}\n\n`;
    }
  }
  if (state.siteUrl) msg+=`\n<${state.siteUrl}|View Full Report>`;
  return msg.trimEnd();
}

function renderSlackMsgPreview(msg) {
  let inMove = false;
  return msg.split('\n').map(line=>{
    if (line.includes('THE MOVE THIS WEEK')) inMove = true;
    else if (line.match(/^[📡⚡🏢👁🔍]/)) inMove = false;
    if (line.startsWith('━')) return `<div style="border-top:1px solid rgba(255,255,255,0.08);margin:6px 0;"></div>`;
    if (line.startsWith('>')) {
      const formatted = esc(line.slice(1)).replace(/\*(.+?)\*/g,'<strong style="color:#fff;">$1</strong>');
      if (inMove) return `<div style="border-left:3px solid ${C.lime};padding:8px 12px;background:rgba(215,230,65,0.05);border-radius:0 4px 4px 0;color:rgba(255,255,255,0.7);font-size:12.5px;line-height:1.6;margin:4px 0;">${formatted}</div>`;
      return `<div style="border-left:2px solid rgba(255,255,255,0.2);padding-left:10px;color:rgba(255,255,255,0.5);font-style:italic;margin:2px 0;font-size:12.5px;">${formatted}</div>`;
    }
    const formatted=esc(line).replace(/&lt;https?:\/\/[^|]+\|([^>]+)&gt;/g,'<span style="color:rgba(255,255,255,0.6);">$1</span>').replace(/\*(.+?)\*/g,'<strong style="color:#fff;">$1</strong>').replace(/_(.*?)_/g,'<em>$1</em>');
    const isHeader=line.match(/^[📡👁🏢↗️⚡🔍]/);
    return `<div style="font-size:${isHeader?'13px':'12.5px'};font-weight:${isHeader?600:400};color:${isHeader?'#fff':'rgba(255,255,255,0.55)'};line-height:1.6;margin-bottom:${isHeader?'3px':'1px'};">${formatted||'&nbsp;'}</div>`;
  }).join('');
}

async function sendToSlack() {
  if (!state.slackWebhook || state.slackSending) return;
  state.slackSending=true; state.slackSent=false; state.slackError=''; render();
  try {
    await fetch(state.slackWebhook, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        username:'Labi', icon_emoji:':mag:',
        text: generateSlackMessage(),
      }),
    });
    state.slackSent=true; state.slackSending=false; render();
    setTimeout(()=>{state.slackSent=false;render();},4000);
  } catch(e) {
    state.slackError='Failed to send. Check your webhook URL.';
    state.slackSending=false; render();
  }
}

function renderIndustrySection(body, accent) {
  accent = accent || C.lime;
  const blocks=[]; let cur=null;
  for(const line of body.split('\n')){
    if(line.match(/^\*\*.+\*\*/)){if(cur)blocks.push(cur);cur={name:line.replace(/\*\*/g,'').trim(),lines:[]};}
    else if(cur&&line.trim())cur.lines.push(line);
  }
  if(cur)blocks.push(cur);
  if(!blocks.length) return `<div style="font-family:${GF};font-size:15px;line-height:1.78;color:${C.muted};">${parseMd(body)}</div>`;

  const tabs = blocks.map((b,i)=>{
    const clientName = b.name.split('(')[0].trim();
    const industry = b.name.match(/\(([^)]+)\)/)?.[1]||'';
    const isActive = i===0;
    return `
    <button class="client-sidebar-tab" data-tab="${i}"
      style="flex:1;padding:0 0 0 24px;
      background:${isActive?'rgba(255,255,255,0.04)':'transparent'};
      border:none;outline:none;
      border-left:2px solid ${isActive?accent:'transparent'};

      <div style="font-size:11px;color:${isActive?'rgba(255,255,255,0.3)':'rgba(255,255,255,0.15)'};">${esc(industry)}</div>
    </button>`;
  }).join('');

  const panels = blocks.map((b,i)=>{
    const industry=b.name.match(/\(([^)]+)\)/)?.[1]||'';
    const rows=b.lines.map(line=>{
      const m=line.match(/^(News|Why it matters|Question to bring up):\s*(.*)/i);
      if(!m) return '';
      const lc = m[1].toLowerCase();
      const labelColor = lc==='news'?C.teal : lc==='why it matters'?C.blue : C.dim;
      return `<div style="padding:20px 0;border-bottom:1px solid rgba(255,255,255,0.05);">
        <div style="font-family:${GM};font-size:9px;letter-spacing:0.16em;color:${labelColor};margin-bottom:10px;text-transform:uppercase;">${m[1]}</div>
        <div style="font-family:${GF};font-size:16px;color:rgba(255,255,255,0.7);line-height:1.7;">${parseMd(m[2])}</div>
      </div>`;
    }).join('');
    return `<div class="client-panel" data-panel="${i}" style="display:${i===0?'block':'none'};flex:1;">
      <div style="font-size:36px;font-weight:800;letter-spacing:-0.03em;line-height:1;margin-bottom:6px;">${esc(b.name.split('(')[0].trim())}</div>
      ${industry?`<div style="font-family:${GM};font-size:9px;color:${C.dim};letter-spacing:0.14em;margin-bottom:32px;text-transform:uppercase;">${esc(industry)}</div>`:'<div style="height:32px;"></div>'}
      ${rows}
    </div>`;
  }).join('');

  return `<div style="display:flex;min-height:360px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:12px;overflow:hidden;">
    <div style="width:240px;flex-shrink:0;border-right:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;">${tabs}</div>

}

// ─── SCAN LOG ─────────────────────────────────────────────────────────────────
function renderScanLog() {
  const steps=getScanSteps();
  const isPplx=state.perplexityKey||state.demoMode;
  const rows=steps.map((s,i)=>{
    const done=i<state.step-1,active=i===state.step-1;
    const showPplxTag=(isPplx||state.demoMode)&&i<2;
    const subLines=showPplxTag&&done&&state.perplexitySubLines.length?state.perplexitySubLines:[];
    return `<div class="scan-step" style="display:flex;flex-direction:column;padding:12px 20px;${i<steps.length-1?`border-bottom:1px solid ${C.border}`:''}">
      <div style="display:flex;align-items:center;gap:14px;">
        <span class="step-icon${active?' scan-blink':''}" style="font-size:14px;width:18px;text-align:center;color:${done?C.teal:active?'#fff':C.dim};">${done?'✓':active?'◎':'○'}</span>
        <div style="flex:1;">
          <span style="font-family:${GF};font-size:13px;color:${done||active?'#fff':C.dim};font-weight:${active?500:400};">${showPplxTag?`<span style="color:${C.blue};font-weight:500;">[Perplexity]</span> `:''}${esc(s)}</span>
          ${active?`<div style="height:1px;background:${C.border};border-radius:1px;margin-top:8px;overflow:hidden;"><div style="height:100%;background:${C.blue};border-radius:1px;animation:progressBar 0.7s ease forwards;"></div></div>`:''}
        </div>
        ${done?`<span style="font-family:${GM};font-size:9px;letter-spacing:0.12em;color:${C.teal};background:rgba(0,230,197,0.08);padding:2px 8px;border-radius:100px;">DONE</span>`:''}
      </div>
      ${subLines.length?`<div style="margin-top:6px;padding-left:32px;display:flex;flex-direction:column;gap:3px;">${subLines.map(l=>`<div style="font-family:${GM};font-size:9px;color:rgba(0,230,197,0.65);">› ${esc(l)}</div>`).join('')}</div>`:''}
    </div>`;
  }).join('');
  return `<div class="fu" style="background:${C.card};border:1px solid ${C.border};border-radius:8px;overflow:hidden;margin-top:18px;">
    <div style="padding:12px 20px;border-bottom:1px solid ${C.border};display:flex;align-items:center;justify-content:space-between;">
      <span style="font-family:${GM};font-size:9px;letter-spacing:0.14em;color:${C.dim};">AGENT LOG</span>
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="width:6px;height:6px;border-radius:50%;background:${C.teal};animation:glowPulse 1s ease infinite;"></div>
        <span style="font-family:${GM};font-size:9px;color:${C.teal};letter-spacing:0.1em;">LIVE</span>
        <span style="font-family:${GM};font-size:9px;color:${C.dim};">·</span>
        <span id="scan-elapsed" style="font-family:${GM};font-size:9px;color:${C.dim};">0s</span>
      </div>
    </div>
    ${rows}
  </div>`;
}

          <div style="width:34px;height:34px;border-radius:6px;background:linear-gradient(135deg,${C.blue},${C.teal});flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:${GF};font-size:11px;font-weight:700;color:#000;">TL</div>
          <div style="flex:1;min-width:0;">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
              <span style="font-family:${GF};font-size:13px;font-weight:600;color:#fff;">Labi</span>
              <span style="font-family:${GF};font-size:11px;color:rgba(255,255,255,0.3);">Today at 8:00 AM</span>
              <span style="background:#5865f2;color:#fff;padding:1px 6px;border-radius:3px;font-family:${GM};font-size:9px;font-weight:700;">APP</span>
            </div>
            <div style="font-family:${GF};line-height:1.6;">${renderSlackMsgPreview(collapsed)}</div>
            ${!state.slackOpen?`
              <div style="height:24px;background:linear-gradient(to bottom,transparent,#1a1d21);margin-top:-24px;position:relative;pointer-events:none;"></div>
              <button id="slack-show-more" style="background:none;border:none;color:${C.lime};cursor:pointer;font-family:${GF};font-size:12px;padding:6px 0 0 0;">Show more ↓</button>`:''}
          </div>
        </div>
      </div>
    </div>`;
}

// ─── HISTORY COLORS ───────────────────────────────────────────────────────────
const WEEK_COLORS = [
  { bg:'rgba(215,230,65,0.08)',  border:'rgba(215,230,65,0.25)',  accent:'#d7e641' },
  { bg:'rgba(0,230,197,0.08)',   border:'rgba(0,230,197,0.25)',   accent:'#00E6C5' },
  { bg:'rgba(79,142,247,0.08)',  border:'rgba(79,142,247,0.25)',  accent:'#4f8ef7' },
  { bg:'rgba(167,139,250,0.08)', border:'rgba(167,139,250,0.25)', accent:'#a78bfa' },
  { bg:'rgba(248,180,100,0.08)', border:'rgba(248,180,100,0.25)', accent:'#f8b464' },
];

// ─── HISTORY PANEL ────────────────────────────────────────────────────────────
const SECTION_META = {
  'THIS WEEK IN CLIENT INDUSTRIES':              { icon:'📡', label:'CLIENT WATCH' },
  'DESIGN SIGNALS WORTH WATCHING':               { icon:'👁', label:'DESIGN SIGNALS' },
  'WHAT COMPETITORS ARE DOING':                  { icon:'🏢', label:'COMPETITOR MOVES' },
  'ONE THING TO BRING UP WITH A CLIENT THIS WEEK':{ icon:'↗️', label:'THE MOVE' },
  'STUDIO TOOL ALERT':                           { icon:'⚡', label:'TOOL ALERT' },
  "THIS WEEK'S INTELLIGENCE":                    { icon:'🔍', label:'INTELLIGENCE' },
};

function renderHistoryPanel() {
  const history = state.history;

  const shell = (backBtn, inner) => `
    <div class="history-panel" style="position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:#0a0a0a;border-left:1px solid ${C.border};z-index:200;display:flex;flex-direction:column;overflow:hidden;">
      <div style="padding:14px 20px;border-bottom:1px solid ${C.border};display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
        <div style="display:flex;align-items:center;gap:10px;">
          ${backBtn?`<button id="history-back" style="background:none;border:none;color:${C.dim};cursor:pointer;font-family:${GM};font-size:9px;letter-spacing:0.1em;display:flex;align-items:center;gap:5px;padding:0;">← BACK</button><div style="width:1px;height:14px;background:${C.border};"></div>`:''}
          <span style="color:${C.dim};display:flex;">${ICON_HISTORY}</span>
          <span style="font-family:${GM};font-size:10px;font-weight:500;letter-spacing:0.14em;color:${C.dim};">PAST DROPS</span>
          <span style="font-family:${GM};font-size:9px;color:rgba(255,255,255,0.15);background:${C.surface};padding:2px 8px;border-radius:100px;">${history.length}</span>
        </div>
        <button id="close-history" style="background:none;border:none;color:${C.dim};cursor:pointer;font-size:20px;line-height:1;">×</button>
      </div>
      ${inner}
    </div>`;

  if (history.length === 0) return shell(false, `
    <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;text-align:center;">
      <div>
        <div style="font-size:32px;margin-bottom:12px;opacity:0.3;">🗂</div>
        <div style="font-family:${GF};font-size:13px;color:${C.dim};line-height:1.6;">No past drops yet.<br>Run your first drop to save it here.</div>
      </div>
    </div>`);

  // ── DETAIL VIEW ──────────────────────────────────────────────────────────────
  if (state.historyView === 'detail') {
    const item = history.find(h => h.id === state.historyDetailId) || history[0];
    const sections = parseReport(item.report);
    return shell(true, `
      <div style="flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px;">
        <div style="animation:fadeInUp 0.2s ease forwards;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="font-family:${GM};font-size:22px;font-weight:800;color:#fff;letter-spacing:-0.02em;">WK ${item.weekNum}</span>
              <span style="font-family:${GM};font-size:9px;color:${C.dim};background:${C.surface};padding:3px 10px;border-radius:100px;border:1px solid ${C.border};">${esc(item.date)}</span>
            </div>
            <button class="delete-history-selected" data-id="${item.id}" style="background:none;border:none;color:${C.dim};cursor:pointer;font-family:${GM};font-size:9px;opacity:0.4;text-decoration:underline;transition:opacity 0.15s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.4">delete</button>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px;">
            ${item.clients.map(c=>`<span style="font-family:${GF};font-size:10px;color:${C.dim};background:${C.surface};padding:2px 8px;border-radius:100px;border:1px solid ${C.border};">${esc(c)}</span>`).join('')}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${sections.map((s,i)=>{
            const meta = SECTION_META[s.title] || {icon:'•', label:s.title};
            const col = WEEK_COLORS[i % WEEK_COLORS.length];
            const bodyHtml = esc(s.body.trim())
              .replace(/\*\*(.+?)\*\*/g,'<strong style="color:#fff;font-weight:600;">$1</strong>')
              .replace(/\*(.+?)\*/g,'<em style="color:rgba(255,255,255,0.7);">$1</em>');
            return `
            <div style="background:${col.bg};border:1px solid ${col.border};border-radius:10px;padding:16px;animation:fadeInUp 0.25s ease ${i*50}ms forwards;opacity:0;">
              <div style="display:flex;align-items:center;gap:7px;margin-bottom:10px;">
                <span style="font-size:14px;">${meta.icon}</span>
                <span style="font-family:${GM};font-size:9px;letter-spacing:0.12em;color:${col.accent};font-weight:600;">${meta.label}</span>
              </div>
              <div style="font-family:${GF};font-size:12px;color:rgba(255,255,255,0.6);line-height:1.75;white-space:pre-wrap;">${bodyHtml}</div>
            </div>`;
          }).join('')}
        </div>
      </div>`);
  }

  // ── BOARD VIEW (sticky notes) ─────────────────────────────────────────────
  return shell(false, `
    <div style="flex:1;overflow-y:auto;padding:20px;">
      <div style="font-family:${GM};font-size:9px;color:${C.dim};letter-spacing:0.12em;margin-bottom:14px;">TAP A WEEK TO EXPLORE</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        ${history.map((item, i) => {
          const col = WEEK_COLORS[i % WEEK_COLORS.length];
          const clientPreview = item.clients.slice(0,3).join(' · ') + (item.clients.length > 3 ? ` +${item.clients.length-3}` : '');
          return `
          <button class="history-board-note" data-id="${item.id}" style="
            background:${col.bg};border:1px solid ${col.border};border-radius:12px;
            padding:18px 16px;cursor:pointer;text-align:left;
            transition:transform 0.15s,border-color 0.15s,box-shadow 0.15s;
            animation:fadeInUp 0.3s ease ${i*60}ms forwards;opacity:0;
          " onmouseover="this.style.transform='translateY(-3px)';this.style.boxShadow='0 8px 24px rgba(0,0,0,0.4)';this.style.borderColor='${col.accent}';"
            onmouseout="this.style.transform='';this.style.boxShadow='';this.style.borderColor='${col.border}';">
            <div style="font-family:${GM};font-size:28px;font-weight:800;color:${col.accent};letter-spacing:-0.02em;line-height:1;margin-bottom:8px;">WK ${item.weekNum}</div>
            <div style="font-family:${GM};font-size:9px;color:rgba(255,255,255,0.35);letter-spacing:0.08em;margin-bottom:12px;">${esc(item.date)}</div>
            <div style="font-family:${GF};font-size:11px;color:rgba(255,255,255,0.4);line-height:1.5;">${esc(clientPreview)}</div>
          </button>`;
        }).join('')}
      </div>
    </div>`);
}

// ─── AUTO-PILOT ───────────────────────────────────────────────────────────────
function renderAutoPilot() {
  const on = state.autoPilotEnabled;
  const log = state.autoPilotLog;
  const sim = state.autoPilotSimulating;
  const sent = state.autoPilotJustSent;

  const now = new Date();
  const daysUntilMonday = (1 + 7 - now.getDay()) % 7 || 7;
  const nextMonday = new Date(now); nextMonday.setDate(now.getDate() + daysUntilMonday);
  const nextLabel = nextMonday.toLocaleDateString('en-US',{month:'long',day:'numeric'}) + ' at 8:00 AM';

  return `
  <div style="background:${C.card};border:1px solid ${C.border};border-radius:8px;overflow:hidden;margin-top:12px;animation:fadeInUp 0.5s ease 0.6s forwards;opacity:0;">
    <div style="padding:12px 18px;border-bottom:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:space-between;">
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-size:13px;">⚡</span>
        <span style="font-family:${GM};font-size:9px;letter-spacing:0.14em;color:${C.dim};">AUTO-PILOT</span>
        ${on?`<span style="background:rgba(0,230,197,0.1);color:${C.teal};padding:2px 8px;border-radius:100px;font-family:${GM};font-size:8px;letter-spacing:0.1em;">ACTIVE</span>`:''}
        ${state.demoMode?`<span style="background:rgba(216,92,224,0.1);color:#d85ce0;padding:2px 8px;border-radius:100px;font-family:${GM};font-size:8px;letter-spacing:0.1em;">DEMO</span>`:''}
      </div>
      <button id="autopilot-toggle" style="
        width:42px;height:23px;border-radius:100px;border:none;cursor:pointer;position:relative;
        background:${on?C.teal:'rgba(255,255,255,0.08)'};transition:background 0.25s;flex-shrink:0;
      "><span style="position:absolute;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left 0.25s;left:${on?'22px':'3px'};"></span></button>
    </div>

    ${on?`
    <div style="padding:14px 18px;display:flex;flex-direction:column;gap:10px;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div style="background:${C.surface};border:1px solid ${C.border};border-radius:8px;padding:12px 14px;">
          <div style="font-family:${GM};font-size:8px;color:${C.dim};letter-spacing:0.1em;margin-bottom:5px;">SCHEDULE</div>
          <div style="font-size:13px;font-weight:600;">Every Monday</div>
          <div style="font-family:${GM};font-size:10px;color:${C.dim};margin-top:2px;">8:00 AM CST</div>
        </div>
        <div style="background:rgba(0,230,197,0.05);border:1px solid rgba(0,230,197,0.15);border-radius:8px;padding:12px 14px;">
          <div style="font-family:${GM};font-size:8px;color:${C.teal};letter-spacing:0.1em;margin-bottom:5px;">NEXT RUN</div>
          <div style="font-size:12px;font-weight:600;color:${C.teal};">${nextLabel}</div>
          <div style="font-family:${GM};font-size:10px;color:${C.dim};margin-top:2px;">${state.clients.length} clients · Slack</div>
        </div>
      </div>

      <div>
        <div style="font-family:${GM};font-size:8px;color:${C.dim};letter-spacing:0.1em;margin-bottom:8px;">RUN LOG</div>
        <div style="display:flex;flex-direction:column;gap:5px;">
          ${log.map(entry=>`
          <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:${C.surface};border:1px solid ${C.border};border-radius:6px;">
            <span style="font-family:${GM};font-size:8px;padding:2px 7px;border-radius:100px;flex-shrink:0;
              background:${entry.status==='sent'?'rgba(0,230,197,0.1)':'rgba(248,113,113,0.1)'};
              color:${entry.status==='sent'?C.teal:'#f87171'};">${entry.status==='sent'?'SENT':'FAILED'}</span>
            <span style="font-family:${GM};font-size:9px;color:${C.dim};flex:1;">${esc(entry.date)} · ${esc(entry.time)}</span>
            <span style="font-size:11px;color:rgba(255,255,255,0.3);">${entry.note?esc(entry.note):entry.clients+' clients'}</span>
          </div>`).join('')}
        </div>
      </div>

      ${state.demoMode?`
      <button id="autopilot-simulate" style="
        width:100%;padding:10px;border-radius:8px;cursor:${sim?'default':'pointer'};
        background:${sent?'rgba(0,230,197,0.15)':sim?'rgba(255,255,255,0.04)':'rgba(255,255,255,0.05)'};
        border:1px solid ${sent?C.teal:sim?C.border:C.border};
        font-family:${GM};font-size:10px;letter-spacing:0.08em;
        color:${sent?C.teal:sim?C.dim:'rgba(255,255,255,0.5)'};
        transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;
      " ${sim?'disabled':''}>
        ${sent?'✓ DROP SENT TO SLACK':sim?'<span style="display:flex;gap:3px;"><span style="animation:bounce 0.6s infinite 0ms alternate;display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;"></span><span style="animation:bounce 0.6s infinite 150ms alternate;display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;"></span><span style="animation:bounce 0.6s infinite 300ms alternate;display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;"></span></span> RUNNING DROP…':'▶ SIMULATE MONDAY DROP'}
      </button>`:''}
    </div>`:`
    <div style="padding:16px 18px;text-align:center;">
      <div style="font-family:${GF};font-size:12px;color:${C.dim};line-height:1.6;">Enable auto-pilot to send the drop to Slack every Monday at 8am automatically — no clicks needed.</div>
    </div>`}
  </div>`;
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  const app=document.getElementById('app');
  if (!state.apiKey) { app.innerHTML=renderSetup(); bindSetup(); }
  else { app.innerHTML=renderMain(); bindMain(); }
}

// ─── BINDINGS ─────────────────────────────────────────────────────────────────
function bindSetup() {
  document.getElementById('demo-btn')?.addEventListener('click',()=>{state.demoMode=true;state.apiKey='demo';render();});
  document.getElementById('connect-keys-btn')?.addEventListener('click',()=>{state.showConnectKeys=true;render();bindSetup();});
  document.getElementById('cancel-keys-btn')?.addEventListener('click',()=>{state.showConnectKeys=false;render();bindSetup();});

  const input=document.getElementById('api-key-input');
  const errEl=document.getElementById('api-key-error');
  if(!input) return;
  const save=()=>{
    const key=input.value.trim();
    if(!key.startsWith('sk-ant-')){errEl.textContent='Must start with sk-ant-';errEl.style.display='block';input.style.borderColor='rgba(248,113,113,0.5)';return;}
    localStorage.setItem('lab_mid_key',key);state.apiKey=key;
    const pplxInput=document.getElementById('pplx-key-input');
    if(pplxInput){const pk=pplxInput.value.trim();if(pk){localStorage.setItem('lab_pplx_key',pk);state.perplexityKey=pk;}}
    render();
  };
  input.addEventListener('keydown',e=>{if(e.key==='Enter')save();});
  input.addEventListener('input',()=>{errEl.style.display='none';input.style.borderColor=C.border;});
  document.getElementById('activate-btn')?.addEventListener('click',save);
}

            nav.style.background = entry.target.dataset.navBg || 'rgba(0,0,0,0.85)';

function doAddClient() {
  const name=(document.getElementById('new-client-name')?.value||'').trim();
  const industry=(document.getElementById('new-client-industry')?.value||'').trim();
  if(!name)return;
  state.clients.push({id:Date.now(),name,industry:industry||'Industry'});
  state.newClient={name:'',industry:''};state.addingClient=false;render();
}

// ─── RUN ──────────────────────────────────────────────────────────────────────
async function runDrop() {
  if(!state.clients.length)return;
  state.phase='running';state.report='';state.error='';state.step=0;state.liveSignals=null;state.perplexitySubLines=[];render();

  let elapsed=0;
  const timerInterval=setInterval(()=>{
    elapsed++;
    const el=document.getElementById('scan-elapsed');
    if(el)el.textContent=`${elapsed}s`;
  },1000);

  try {
    let pxContext='';

    // Phase 1: Perplexity research (real or demo simulation)
    if(state.perplexityKey||state.demoMode){
      state.step=1;updateScanLog();
      await new Promise(r=>setTimeout(r,600));
      state.step=2;updateScanLog();
      let signals;
      if(state.demoMode){
        await new Promise(r=>setTimeout(r,900)); // simulate search time
        signals=DEMO_SIGNALS;
      } else {
        signals=await callPerplexity();
        pxContext=formatPerplexityContext(signals);
      }
      state.liveSignals=signals;
      // Build sub-lines for scan log display
      const subLines=[];
      (signals.clientNews||[]).slice(0,3).forEach(n=>subLines.push(`${n.company}: ${n.headline.slice(0,60)}${n.headline.length>60?'…':''}`));
      (signals.designSignals||[]).slice(0,1).forEach(n=>subLines.push(`Design: ${n.headline.slice(0,55)}${n.headline.length>55?'…':''}`));
      state.perplexitySubLines=subLines;
      render(); // re-render to show sub-lines
      await new Promise(r=>setTimeout(r,500));
    }

    // Phase 2: remaining steps + Claude in parallel
    const steps=getScanSteps();
    const startStep=(state.perplexityKey||state.demoMode)?3:1;
    const stepThrough=async()=>{
      for(let i=startStep;i<=steps.length;i++){
        state.step=i;updateScanLog();
        await new Promise(r=>setTimeout(r,780));
      }
    };

    const [result]=await Promise.all([
      state.demoMode?Promise.resolve(DEMO_REPORT):callApi(state.apiKey,state.clients,state.focus,pxContext),
      stepThrough(),
    ]);

    clearInterval(timerInterval);
    state.report=result;state.phase='done';
    saveHistory(result);
  } catch(e) {
    clearInterval(timerInterval);
    state.error=e.message;state.phase='idle';
  }
  render();
}

function updateScanLog() {
  const stepEls=document.querySelectorAll('.scan-step');
  if(!stepEls.length)return;
  getScanSteps().forEach((_,i)=>{
    const el=stepEls[i];if(!el)return;
    const done=i<state.step-1,active=i===state.step-1;
    const icon=el.querySelector('.step-icon');
    if(icon){icon.textContent=done?'✓':active?'◎':'○';icon.style.color=done?C.teal:active?'#fff':C.dim;active?icon.classList.add('scan-blink'):icon.classList.remove('scan-blink');}
    const textSpan=el.querySelector('span:not(.step-icon)');
    if(textSpan){textSpan.style.color=(done||active)?'#fff':C.dim;textSpan.style.fontWeight=active?'500':'400';}
    const innerDiv=el.querySelector('div');
    if(innerDiv){
      let bar=innerDiv.querySelector('.prog-track');
      if(active&&!bar){const t=document.createElement('div');t.className='prog-track';t.style.cssText=`height:1px;background:${C.border};border-radius:1px;margin-top:8px;overflow:hidden;`;t.innerHTML=`<div style="height:100%;background:${C.blue};border-radius:1px;animation:progressBar 0.7s ease forwards;"></div>`;innerDiv.appendChild(t);}
      else if(!active&&bar)bar.remove();
    }
    let badge=el.querySelector('.done-badge');
    if(done&&!badge){const b=document.createElement('span');b.className='done-badge';b.style.cssText=`font-family:${GM};font-size:9px;letter-spacing:0.12em;color:${C.teal};background:rgba(0,230,197,0.08);padding:2px 8px;border-radius:100px;`;b.textContent='DONE';el.appendChild(b);}
    else if(!done&&badge)badge.remove();
  });
}

render();
</script>
</body>
</html>
